summary: news_crawler_flow_theanh
description: ''
value:
  modules:
    - id: check_rss_feeds
      summary: Check RSS feeds for new articles
      value:
        type: script
        input_transforms:
          feeds:
            type: static
        is_trigger: false
        path: f/scripts_theanh/crawler_theanh
      continue_on_error: false
    - id: loop
      summary: For loop
      value:
        type: forloopflow
        modules:
          - id: fetch_html
            summary: Fetch full HTML content
            value:
              type: script
              input_transforms:
                article:
                  type: javascript
                  expr: flow_input.iter.value
              is_trigger: false
              path: f/scripts_theanh/fetch_html_theanh
          - id: batch_extract_llm
            summary: Batch_extract_llm
            value:
              type: script
              input_transforms:
                batch_size:
                  type: static
                  value: 12
              is_trigger: false
              path: f/scripts_theanh/_batch_extract_news_with_llm
        iterator:
          type: javascript
          expr: results.check_rss_feeds.new_articles
        parallel: false
        skip_failures: true
      mock:
        enabled: false
        return_value:
          example: value
    - id: stats
      summary: stats_crawl
      value:
        type: script
        input_transforms:
          timeframe_days:
            type: static
            value: 1
        is_trigger: false
        path: f/scripts_theanh/stats_crawler_theanh
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order: []
  properties: {}
  required: []
